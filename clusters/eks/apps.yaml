apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 10m0s
  path: ./clusters/eks/k8s
  prune: true
  targetNamespace: default
  sourceRef:
    kind: GitRepository
    name: flux-system
