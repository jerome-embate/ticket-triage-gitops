apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ticket-triage-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ticket-triage-secrets
    creationPolicy: Owner
  data:
    - secretKey: anthropic-api-key
      remoteRef:
        key: ticket-triage
        property: ANTHROPIC_API_KEY
